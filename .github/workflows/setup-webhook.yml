name: setup-webhook

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Vercel webhook URL"
        required: true
        default: "https://hermesbot-beta.vercel.app/api/telegram"
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Add the TELEGRAM_BOT_TOKEN secret in GitHub"; exit 1; fi
          if [ -z "$SECRET" ]; then echo "::error::Add the TELEGRAM_WEBHOOK_SECRET secret in GitHub (same value as in Vercel)"; exit 1; fi
          if ! echo "$SECRET" | grep -Eq '^[A-Za-z0-9_-]{1,256}$'; then echo "::error::TELEGRAM_WEBHOOK_SECRET may only contain letters, numbers, _ and -"; exit 1; fi

      - name: Set Telegram webhook
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          URL: ${{ inputs.url }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode "drop_pending_updates=true"
          echo

      - name: Set command menu
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[
              {"command":"news","description":"Latest AI news"},
              {"command":"lesson","description":"Today'"'"'s system design lesson"},
              {"command":"next","description":"Tomorrow'"'"'s lesson, to read ahead"},
              {"command":"topic","description":"Lesson on any topic"},
              {"command":"ask","description":"Ask a system design question"},
              {"command":"list","description":"All topics and today'"'"'s place"},
              {"command":"help","description":"Show commands"}
            ]}'
          echo

      - name: Show webhook status
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS "https://api.telegram.org/bot${TOKEN}/getWebhookInfo"
          echo
