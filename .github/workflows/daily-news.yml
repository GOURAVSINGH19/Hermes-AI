name: daily-news

on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC = 1:00 PM IST, every day
  workflow_dispatch:        # "Run workflow" button for manual testing

permissions:
  contents: write           # allows committing data/news back to the repo

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch news and send to Telegram
        run: node news.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit news files
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "news: $(date -u +%F)"
          git push
