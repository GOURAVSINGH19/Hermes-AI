name: command

on:
  workflow_dispatch:
    inputs:
      command:
        required: true
        type: string
      text:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Telegram command
        run: node command.js
        env:
          CMD: ${{ inputs.command }}
          CMD_TEXT: ${{ inputs.text }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_LESSON_MAX_TOKENS: ${{ vars.AI_LESSON_MAX_TOKENS }}
          AI_ANSWER_MAX_TOKENS: ${{ vars.AI_ANSWER_MAX_TOKENS }}
          NEWS_QUERY: ${{ vars.NEWS_QUERY }}
          NEWS_COUNT: ${{ vars.NEWS_COUNT }}
          TOPICS_SOURCE_URL: ${{ vars.TOPICS_SOURCE_URL }}
          COURSE_START_DATE: ${{ vars.COURSE_START_DATE }}
